name: Plugin packages

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Check plugin runtime syntax
        run: |
          for file in codex-plugin/*.mjs; do node --check "$file"; done
      - run: npm run test:plugins
      - name: Build packages
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/package-plugins.py --tag "$RELEASE_TAG"
          else
            python3 scripts/package-plugins.py
          fi
      - name: Upload downloadable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-deathmatch-plugins
          path: dist/plugins/
          if-no-files-found: error
      - name: Attach downloads to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/plugins/*.zip dist/plugins/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/plugins/*.zip dist/plugins/SHA256SUMS --verify-tag --title "Agent Deathmatch plugins $RELEASE_TAG" --generate-notes
          fi
