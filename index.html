<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <!-- ≤160 chars — Google truncates around 155–160. -->
    <meta
      name="description"
      content="Kill time while your coding agent works. Play Agent Deathmatch through Codex, see your scoreboard when a task finishes, and get back to work."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0c0d0b" />
    <title>Agent Deathmatch — Play While Your Coding Agent Works</title>
    <link rel="canonical" href="https://instagib.win/" />

    <!-- Social link previews: a pasted invite / share link renders as a game,
         not a naked URL. og-agent-deathmatch.png lives in /public (1731x909).
         OG image MUST be an absolute URL — relative paths fail in several
         scrapers (Facebook, Slack, some Discord cases). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agent Deathmatch" />
    <meta property="og:url" content="https://instagib.win/" />
    <meta property="og:title" content="Agent Deathmatch — Play While Codex Works" />
    <meta
      property="og:description"
      content="Give Codex a task. Grab a railgun. When a monitored task finishes, see your personal scoreboard and return to work. Codex supported today."
    />
    <meta property="og:image" content="https://instagib.win/og-agent-deathmatch.png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="Agent Deathmatch — kill time while your coding agent works" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@einfachai" />
    <meta name="twitter:creator" content="@einfachai" />
    <meta name="twitter:title" content="Agent Deathmatch — Play While Codex Works" />
    <meta
      name="twitter:description"
      content="Kill time while your coding agent works. One-shot robot deathmatch, a personal scoreboard, then back to Codex when your task finishes."
    />
    <meta name="twitter:image" content="https://instagib.win/og-agent-deathmatch.png" />

    <!-- Structured data: lets Google show a VideoGame rich result and helps
         AI/search crawlers understand the page even without running JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Agent Deathmatch",
        "url": "https://instagib.win/",
        "sameAs": ["https://x.com/einfachai", "https://discord.gg/uMKsq3ESGs"],
        "image": "https://instagib.win/og-agent-deathmatch.png",
        "description": "A multiplayer robot arena shooter for the wait while your coding agent works. Launch through the Codex plugin, play continuous deathmatch, then see your personal scoreboard and return to Codex when a monitored task finishes. Codex is the only supported coding agent today.",
        "genre": ["First-person shooter", "Arena shooter", "Instagib"],
        "gamePlatform": ["Web browser"],
        "operatingSystem": "Any (web browser)",
        "applicationCategory": "Game",
        "playMode": ["MultiPlayer", "SinglePlayer"],
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <!-- Fonts are self-hosted (public/fonts, OFL) and declared with
         font-display: swap in src/index.css — no render-blocking third-party
         stylesheet. Preload only the two faces above the fold on first paint:
         the body face and the display weight the wordmark/CTA use. -->
    <link rel="preload" href="/fonts/Geist-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ChakraPetch-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlable fallback: the app is a React SPA, so without this a crawler
         that doesn't run JS (most social/AI scrapers) sees an empty page.
         This gives search engines real, indexable text. -->
    <noscript>
      <main style="max-width: 720px; margin: 0 auto; padding: 2rem; font-family: system-ui, sans-serif; color: #eee; background: #0a0a0a;">
        <h1>Agent Deathmatch</h1>
        <p>Kill time while your coding agent works. Launch through Codex, fight as
          a Codex-themed robot, and return to work when a monitored task finishes.</p>
        <p>One railgun, one shot, one kill. Continuous multiplayer deathmatch with
          bots while alone. Your personal scoreboard appears for five seconds
          before the paired companion brings Codex forward.</p>
        <p>Codex is the only supported coding agent today. Automatic task return
          requires installing the plugin and pairing its local companion.</p>
        <p><a href="https://github.com/einfachai/instagib-arena#install-in-codex">Install in Codex</a>
          · <a href="/play">Try the game</a>
          · <a href="https://discord.gg/uMKsq3ESGs">Discord</a>
          · <a href="https://x.com/einfachai">Twitter / X</a></p>
        <p>This game requires JavaScript to play. Please enable JavaScript.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
